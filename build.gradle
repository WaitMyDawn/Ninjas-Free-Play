plugins { id 'jvm-toolchains' }

def windows = System.getProperty('os.name').toLowerCase().contains('windows')

def platformTask = { String name, String platform, int javaVersion, String task ->
    tasks.register(name, Exec) {
        def launcher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(javaVersion) }
        environment 'JAVA_HOME', launcher.get().metadata.installationPath.asFile.absolutePath
        workingDir layout.projectDirectory.dir("platforms/${platform}")
        commandLine((windows ? ['cmd.exe', '/d', '/c', 'gradlew.bat'] : ['bash', './gradlew']) +
                ['--no-daemon', '--gradle-user-home', gradle.gradleUserHomeDir.absolutePath, task])
        if (gradle.startParameter.offline) args '--offline'
        def installations = providers.gradleProperty('org.gradle.java.installations.paths').orNull
        if (installations) args "-Porg.gradle.java.installations.paths=${installations}"
    }
}
platformTask('buildNeoForge', 'neoforge-1.21.1', 21, 'build')
platformTask('checkNeoForge', 'neoforge-1.21.1', 21, 'check')
platformTask('cleanNeoForge', 'neoforge-1.21.1', 21, 'clean')
platformTask('buildForge', 'forge-1.20.1', 17, 'build')
platformTask('checkForge', 'forge-1.20.1', 17, 'check')
platformTask('cleanForge', 'forge-1.20.1', 17, 'clean')
platformTask('buildFabric', 'fabric-1.21.1', 21, 'build')
platformTask('checkFabric', 'fabric-1.21.1', 21, 'check')
platformTask('cleanFabric', 'fabric-1.21.1', 21, 'clean')
platformTask('generateAnimations', 'neoforge-1.21.1', 21, ':common:generateAnimations')
platformTask('verifyAnimationCore', 'neoforge-1.21.1', 21, 'verifyAnimationCore')
tasks.register('build') { dependsOn 'buildNeoForge', 'buildForge', 'buildFabric' }
tasks.register('check') { dependsOn 'checkNeoForge', 'checkForge', 'checkFabric' }
tasks.register('clean') { dependsOn 'cleanNeoForge', 'cleanForge', 'cleanFabric' }
